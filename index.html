<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEV AGENT TEAM | Secure Gateway</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-base: #030303; --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.5); --gold-dark: #997a00; --primary: #10b981; --info: #0ea5e9; --danger: #ef4444; --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: white; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; perspective: 1200px; background: url('https://www.transparenttextures.com/patterns/cubes.png'), radial-gradient(circle at center, #111, #000); }
        input, button { outline: none; border: none; font-family: inherit; }

        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); color: white; padding: 16px 30px; border-radius: 30px; font-weight: 800; font-size: 14px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.9); z-index: 9999; transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        #toast.show { top: 40px; }

        .gateway-box { width: 100%; max-width: 400px; background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(25px); padding: 50px 40px; border-radius: 30px; border: 1px solid rgba(212,175,55,0.2); text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(212,175,55,0.05); transform-style: preserve-3d; animation: popIn 1s cubic-bezier(0.16, 1, 0.3, 1); position: relative; z-index: 10; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8) translateY(50px) rotateX(10deg); } 100% { opacity: 1; transform: scale(1) translateY(0) rotateX(0); } }

        .logo-wrapper { position: relative; width: 150px; height: 150px; display: flex; justify-content: center; align-items: center; margin: 0 auto 30px; transform-style: preserve-3d; }
        .logo-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0%, var(--gold) 25%, transparent 50%, var(--danger) 75%, transparent 100%); animation: spinRing 3s linear infinite; box-shadow: 0 0 40px var(--gold-glow); }
        .logo-ring::before { content: ''; position: absolute; inset: 4px; background: #050505; border-radius: 50%; }
        .logo-ring::after { content: ''; position: absolute; inset: -10px; border: 1px dashed rgba(255,255,255,0.3); border-radius: 50%; animation: spinRingReverse 6s linear infinite; }
        .logo-wrapper img { position: relative; z-index: 2; height: 80px; object-fit: contain; animation: float3D 3s ease-in-out infinite; }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }
        @keyframes spinRingReverse { 100% { transform: rotate(-360deg); } }
        @keyframes float3D { 0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 20px var(--gold)); } 50% { transform: translateY(-15px) scale(1.05); filter: drop-shadow(0 20px 25px rgba(0,0,0,0.9)); } }

        .dev-agent-text { font-size: 26px; color: var(--gold); text-shadow: 0 0 15px var(--gold-glow); margin-bottom: 5px; height: 35px; display: flex; justify-content: center; align-items: center; letter-spacing: 2px; animation: fontSwap 8s infinite step-end; }
        @keyframes fontSwap { 0% { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; letter-spacing: 2px; } 14% { font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 3px; } 28% { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 4px; } 42% { font-family: 'Press Start 2P', cursive; font-size: 16px; letter-spacing: 1px; } 56% { font-family: 'Cinzel', serif; font-weight: 900; font-size: 28px; } 70% { font-family: 'Monoton', cursive; font-size: 24px; font-weight: normal; } 84% { font-family: 'Permanent Marker', cursive; font-size: 24px; letter-spacing: 1px; } 100% { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; } }

        .sub-text { font-size: 11px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 35px; }

        .input-wrapper { position: relative; margin-bottom: 25px; }
        .pin-input { width: 100%; padding: 20px; background: rgba(0,0,0,0.8); border: 2px solid rgba(212,175,55,0.3); border-radius: 16px; color: var(--gold); font-size: 32px; text-align: center; letter-spacing: 15px; font-weight: 900; transition: 0.3s; box-shadow: inset 0 5px 15px rgba(0,0,0,0.9); text-shadow: 0 0 10px var(--gold-glow); }
        .pin-input:focus { border-color: var(--gold); box-shadow: inset 0 5px 15px rgba(0,0,0,0.9), 0 0 25px var(--gold-glow); }
        .pin-input::placeholder { color: rgba(255,255,255,0.1); font-size: 28px; letter-spacing: 10px; text-shadow: none; font-family: 'Plus Jakarta Sans', sans-serif; }

        .btn-app { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border-radius: 14px; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px var(--gold-glow); text-transform: uppercase; letter-spacing: 2px; position: relative; overflow: hidden; }
        .btn-app:active { transform: translateY(3px); box-shadow: 0 5px 10px var(--gold-glow); }

        .system-tags { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .tag { font-size: 10px; font-weight: 800; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
        .tag.master { color: var(--gold); text-shadow: 0 0 5px var(--gold); }
        .tag.teacher { color: var(--info); text-shadow: 0 0 5px var(--info); }
        .tag.agent { color: var(--primary); text-shadow: 0 0 5px var(--primary); }

        .bg-glow { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; z-index: 1; }
        .glow-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: var(--gold); }
        .glow-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: var(--danger); }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div id="toast"><i id="toastIcon"></i> <span id="toastMsg"></span></div>

    <!-- MAIN GATEWAY UI -->
    <div class="gateway-box">
        <div class="logo-wrapper">
            <div class="logo-ring"></div>
            <img src="Logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/9322/9322127.png'">
        </div>
        
        <!-- FONT ANIMATING TEXT -->
        <div class="dev-agent-text">DEV AGENT TEAM</div>
        <p class="sub-text">Unified Secure Gateway</p>
        
        <div class="input-wrapper">
            <input type="password" id="universalPin" class="pin-input" placeholder="••••" autocomplete="off" inputmode="numeric" maxlength="8">
        </div>
        
        <button class="btn-app" id="loginBtn">Authenticate <i class="fas fa-fingerprint" style="margin-left: 8px;"></i></button>

        <div class="system-tags">
            <div class="tag master"><i class="fas fa-circle" style="font-size: 6px;"></i> Head</div>
            <div class="tag teacher"><i class="fas fa-circle" style="font-size: 6px;"></i> Teacher</div>
            <div class="tag agent"><i class="fas fa-circle" style="font-size: 6px;"></i> Agent</div>
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChJ-rSaMollI_z_2hw93lK5AaA5U7Ig9A",
            authDomain: "vadminportal.firebaseapp.com",
            databaseURL: "https://vadminportal-default-rtdb.firebaseio.com",
            projectId: "vadminportal"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // LIVE GITHUB BASE URL (Trailing slash included)
        const BASE_URL = "https://adarshrajput1078.github.io/Devagent/";

        window.showToast = function(msg, type="success") {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').className = type === 'error' ? 'fas fa-shield-alt' : 'fas fa-check-circle';
            toast.style.borderColor = type === 'error' ? 'var(--danger)' : 'var(--gold)';
            toast.style.color = type === 'error' ? 'var(--danger)' : 'var(--gold)';
            toast.style.boxShadow = type === 'error' ? '0 10px 40px rgba(239, 68, 68, 0.4)' : '0 10px 40px rgba(212, 175, 55, 0.4)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const pin = document.getElementById('universalPin').value.trim();
            const btn = document.getElementById('loginBtn');

            if (!pin) { showToast("Access Denied: PIN Required", "error"); return; }
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Verifying...';

            try {
                // GOD MODE BYPASS
                if (pin === '666') {
                    await set(ref(db, 'users/666'), { role: 'head', status: 'active' });
                    showToast("God Mode Activated", "success");
                    setTimeout(() => {
                        localStorage.setItem('activeSessionPin', pin);
                        window.location.href = BASE_URL + 'Head.html'; 
                    }, 1200);
                    return; 
                }

                // NORMAL USERS (Teacher & Agent)
                const snapshot = await get(ref(db, 'users/' + pin));
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    
                    if (userData.status === 'banned') {
                        showToast("Alert: Account Banned", "error");
                        document.getElementById('universalPin').value = '';
                    } 
                    else if (userData.role === 'head') {
                        showToast("God Mode Activated", "success");
                        setTimeout(() => {
                            localStorage.setItem('activeSessionPin', pin);
                            window.location.href = BASE_URL + 'Head.html'; 
                        }, 1200);
                    }
                    else if (userData.role === 'teacher') {
                        showToast("Routing to Teacher Node...", "success");
                        setTimeout(() => {
                            localStorage.setItem('activeSessionPin', pin);
                            window.location.href = BASE_URL + 'Teacher.html'; 
                        }, 1200);
                    } 
                    else if (userData.role === 'agent') {
                        showToast("Routing to Agent Node...", "success");
                        setTimeout(() => {
                            localStorage.setItem('activeSessionPin', pin);
                            window.location.href = BASE_URL + 'Agent.html';
                        }, 1200);
                    } 
                    else { showToast("System Error: Unknown Role", "error"); }
                } else {
                    showToast("Access Denied: Invalid PIN", "error");
                    document.getElementById('universalPin').value = '';
                }
            } catch (error) { showToast("Connection to Server Lost", "error"); }

            setTimeout(() => {
                if(btn.innerHTML.includes('Verifying')) {
                    btn.innerHTML = 'Authenticate <i class="fas fa-fingerprint" style="margin-left: 8px;"></i>';
                }
            }, 2000);
        });

        document.getElementById('universalPin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
    </script>
</body>
</html>
